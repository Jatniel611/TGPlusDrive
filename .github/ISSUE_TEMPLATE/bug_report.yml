name: Bug report
description: Reporta un error para que podamos corregirlo
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. No incluyas credenciales, sesiones ni datos personales.
  - type: input
    id: version
    attributes:
      label: Versión de TGPlusDrive
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Versión de Windows
      placeholder: "Windows 11 23H2 x64"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abrir la app
        2. Ir a...
        3. Ver error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado real
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Capturas o logs (opcional)
